volumes:
  postgres:

services:
  postgres:
    container_name: postgres
    image: postgres:latest
    shm_size: 128mb
    volumes:
      - "postgres:/var/lib/postgres/data"
    environment:
      - "POSTGRES_DB=app"
      - "POSTGRES_USER=dev"
      - "POSTGRES_PASSWORD=test123"
    ports:
      - "127.0.0.1:5432:5432"