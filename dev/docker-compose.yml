services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:4443:443"
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf:ro,Z"
      - "./sites-enabled:/etc/nginx/sites-enabled:ro,Z"
      - "./certs:/etc/nginx/certs:ro,Z"
    depends_on:
      - frontend

  web:
    image: node:22-alpine
    container_name: web
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"

  api:
    image: node:22-alpine
    container_name: api
    working_dir: /app
    volumes:
      - ./api:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"